<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vunoh Task Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <h1>Vunoh Global Task Dashboard</h1>

        <!-- CREATE TASK -->
        <div class="card">
            <h2>Create Request</h2>

            <input id="message" type="text" placeholder="Type request..." />
            <button onclick="createTask()">Submit</button>

            <p id="response"></p>
        </div>

        <!-- TASK LIST -->
        <div class="card">
            <h2>Tasks</h2>
            <button onclick="loadTasks()">Refresh</button>

            <div id="tasks"></div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
